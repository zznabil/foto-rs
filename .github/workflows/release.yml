name: Release
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
env:
  PYTHONUTF8: "1"
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    name: Verify tag and merged-main CI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.7'
      - run: python tools/check_tag.py
        env:
          GH_TOKEN: ${{ github.token }}
  gates:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  candidate:
    name: Attest and stage draft release
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.7'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release-candidate
          path: release-out
      - run: python tools/check_release.py release-out --expected-commit "$SOURCE_COMMIT"
        env:
          SOURCE_COMMIT: ${{ github.sha }}
      - name: Attest ZIPs and JSON release records
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-out/*.zip
            release-out/*.json
      - name: Include provenance and finalize checksums
        run: |
          cp "$BUNDLE_PATH" release-out/provenance.jsonl
          python tools/finalize_release.py release-out
          python tools/check_release.py release-out --expected-commit "$SOURCE_COMMIT"
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          SOURCE_COMMIT: ${{ github.sha }}
      - name: Upload a draft, never overwrite a published release
        run: gh release create "$RELEASE_TAG" release-out/* --verify-tag --draft --title "Foto ${RELEASE_TAG#v}" --notes-file "docs/releases/$RELEASE_TAG.md"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
  publish:
    name: Verify downloaded assets and publish
    needs: candidate
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.7'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.txt
      - run: python tools/generate_fixtures.py --bench-only
      - name: Enable Defender real-time protection for downloaded executable validation
        shell: pwsh
        run: ./tools/prepare_defender.ps1
      - name: Independently download, verify provenance, test the binary, and publish
        # The hosted image may start with real-time protection disabled.
        run: python tools/publish_release.py --tag "$env:RELEASE_TAG" --expected-commit "$env:SOURCE_COMMIT" --publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
      - name: Retain publication verification receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-receipt
          path: artifacts/downloaded/**/publication-receipt.json
          if-no-files-found: error
          retention-days: 90
