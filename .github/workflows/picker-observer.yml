name: Picker state observer
on:
  pull_request:
    paths:
      - .github/workflows/picker-observer.yml
      - tools/observe_picker.py
      - tools/test_picker_observer.py
      - tools/picker-observer.md
permissions:
  contents: read
env:
  PYTHONUTF8: "1"
concurrency:
  group: picker-observer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  observer:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.txt
      - run: rustup toolchain install 1.98.1 --profile minimal --target x86_64-pc-windows-msvc
      - run: python -m unittest discover -s tools -p "test_picker_observer.py" -v
      - run: cargo build --release --locked
      - run: python tools/generate_fixtures.py --bench-only
      - run: python tools/observe_picker.py
      - name: Retain observer evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: picker-state-observer
          path: |
            artifacts/picker-observer-v1/*.json
            artifacts/runs/*/*.csv
          if-no-files-found: warn
          retention-days: 14
