name: Decoder protocol calibration
on:
  pull_request:
    paths:
      - .github/workflows/decoder-calibration.yml
      - tools/calibrate_decoder.py
      - tools/decoder_calibration/**
      - tools/test_decoder_calibration*.py
permissions:
  contents: read
env:
  PYTHONUTF8: "1"
concurrency:
  group: decoder-calibration-${{ github.ref }}
  cancel-in-progress: false
jobs:
  baseline:
    name: Baseline decoder control protocol
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.7'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.txt
      - run: rustup toolchain install 1.98.1 --profile minimal --target x86_64-pc-windows-msvc
      - run: python -m unittest discover -s tools -p "test_decoder_calibration*.py" -v
      - run: python tools/calibrate_decoder.py
      - name: Retain protocol evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: decoder-control-protocol
          path: |
            artifacts/decoder-calibration-v1/*.json
            artifacts/decoder-calibration-v1/long-*/*.json
            artifacts/decoder-calibration-v1/*.log
          if-no-files-found: warn
          retention-days: 14
