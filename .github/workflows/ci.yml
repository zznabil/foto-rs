name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '23 4 * * 1'
env:
  PYTHONUTF8: "1"
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repository:
    name: Repository and dependency checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - run: rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt,rust-docs --target x86_64-pc-windows-msvc
      - run: python tools/check_repository.py
      - run: python -m unittest discover -s tools -p test_release_checks.py -v
      - run: python tools/run_pinned_tool.py actionlint -color
      - run: python tools/run_pinned_tool.py cargo-deny check
      - name: Review newly introduced dependencies
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          license-check: false
          comment-summary-in-pr: never
  msrv:
    name: Rust 1.85 compatibility
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.85.0 --profile minimal
      - run: cargo +1.85.0 check --locked --all-targets
  windows:
    name: Windows build and journeys
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.txt
      - run: rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt,rust-docs --target x86_64-pc-windows-msvc
      - run: python tools/verify.py
      - run: python tools/package_release.py
      - name: Rebuild vendored source offline in isolation
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          python tools/verify_source.py "release-out/Foto-$version-source.zip" --expected-commit "${{ github.sha }}" --output release-out/source-verification.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/finalize_release.py release-out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_release.py release-out --expected-commit "${{ github.sha }}"
      - name: Retain release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release-candidate
          path: release-out/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Retain failed-gate diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-failure-diagnostics
          path: |
            artifacts/ci/reports/*.json
            artifacts/ci/logs/*.txt
            artifacts/source-rebuild/*.txt
          if-no-files-found: ignore
          retention-days: 14
